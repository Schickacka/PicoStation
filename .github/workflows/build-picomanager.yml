name: Build PicoManager (Linux, Windows & macOS)

on:
  push:
    paths:
      - 'picomanager/**'
      - '.github/workflows/build-picomanager.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: PicoManager-Linux-x86_64
            mode: onefile
            sep: ":"
            artifact_path: picomanager/dist/PicoManager
          - os: windows-latest
            name: PicoManager-Windows-x64
            mode: onedir
            sep: ";"
            artifact_path: picomanager/dist/PicoManager-Windows-x64.zip
          - os: macos-15
            name: PicoManager-macOS-arm64
            mode: onefile
            sep: ":"
            artifact_path: picomanager/dist/PicoManager

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Tk deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install Python deps
        run: pip install -r picomanager/requirements.txt

      - name: Build Windows portable folder (.zip)
        if: runner.os == 'Windows'
        working-directory: picomanager
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --icon=assets/icon.ico --version-file=version_info.txt --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets" --name PicoManager app.py
          Compress-Archive -Path dist/PicoManager -DestinationPath dist/PicoManager-Windows-x64.zip -Force

      - name: Build single-file executable (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: picomanager
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon=assets/icon.ico --add-data "assets/icon.png${{ matrix.sep }}assets" --add-data "assets/icon.ico${{ matrix.sep }}assets" --name PicoManager app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
